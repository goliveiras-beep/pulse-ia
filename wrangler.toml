name = "pulse-ia"
account_id = "9a4057b69f532a7b9c23e6e073925c33" # Isouza@livemode.com's Account
main = "worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]
# workers.dev ligado SÓ pra skill da Alexa (é o endereço cadastrado no Endpoint da skill, com certificado do tipo "wildcard").
# O worker.js responde só em /api/alexa nesse endereço; o resto do Pulse continua só em pulse.livemode.ai.
workers_dev = true
preview_urls = false
keep_names = false   # esbuild injetaria __name() em funções que o Compasso copia como texto pro navegador

[placement]
region = "aws:us-east-1"   # perto de Google Sheets/Airtable (mesma região da Vercel, iad1) — não do usuário

[assets]
directory = ".cf-assets"
binding = "ASSETS"
run_worker_first = true

# Mapa 3D: presença de quem está passeando + "olha isso" (cloudflare/presenca.js). SQLite = disponível no plano grátis.
[[durable_objects.bindings]]
name = "PRESENCA"
class_name = "Presenca"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Presenca"]

[vars]
PULSE_BASE_URL = "https://pulse.livemode.ai"

# Mesmos horários de cloudflare/crons.json (UTC) — a Vercel não roda mais crons.
[triggers]
crons = ["0 9 * * *", "0 2 * * *", "0 14 * * 1", "30 9 * * *"]

# Domínio próprio: só descomentar depois que a zona livemode.ai estiver nesta conta Cloudflare.
[[routes]]
pattern = "pulse.livemode.ai"
custom_domain = true
